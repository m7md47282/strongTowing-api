<div
  class="dashboard-page-skeleton"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <span class="sr-only">Loading dashboard content</span>

  @if (variant === 'admin') {
    <div class="mb-8 space-y-3">
      <div class="sk h-8 w-56 max-w-full rounded-lg bg-gray-200 animate-pulse"></div>
      <div class="sk h-4 w-80 max-w-full rounded-md bg-gray-200 animate-pulse"></div>
    </div>

    <div class="mb-6 flex items-center justify-between">
      <div class="sk h-6 w-32 rounded-md bg-gray-200 animate-pulse"></div>
      <div class="sk h-9 w-32 rounded-lg bg-gray-200 animate-pulse"></div>
    </div>

    <div class="mb-6 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4">
      @for (_ of [1, 2, 3, 4]; track _) {
        <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
          <div class="sk mb-4 h-4 w-28 rounded bg-gray-200 animate-pulse"></div>
          <div class="sk h-9 w-20 rounded-md bg-gray-200 animate-pulse"></div>
        </div>
      }
    </div>

    <div class="mb-6 grid grid-cols-1 gap-6 lg:grid-cols-3">
      <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm lg:col-span-2">
        <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
          <div class="space-y-2">
            <div class="sk h-5 w-52 rounded bg-gray-200 animate-pulse"></div>
            <div class="sk h-4 w-72 max-w-full rounded bg-gray-200 animate-pulse"></div>
          </div>
          <div class="flex gap-2">
            <div class="sk h-9 w-28 rounded-lg bg-gray-200 animate-pulse"></div>
            <div class="sk h-9 w-28 rounded-lg bg-gray-200 animate-pulse"></div>
          </div>
        </div>
        <div class="sk h-64 rounded-lg bg-gray-200 animate-pulse"></div>
      </div>
      <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
        <div class="mb-6 flex items-center justify-between">
          <div class="sk h-5 w-40 rounded bg-gray-200 animate-pulse"></div>
          <div class="sk h-6 w-20 rounded bg-gray-200 animate-pulse"></div>
        </div>
        <div class="sk h-64 rounded-lg bg-gray-200 animate-pulse"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
      <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm lg:col-span-2">
        <div class="mb-6 flex items-center justify-between">
          <div class="sk h-5 w-48 rounded bg-gray-200 animate-pulse"></div>
          <div class="flex gap-2">
            <div class="sk h-8 w-8 rounded bg-gray-200 animate-pulse"></div>
            <div class="sk h-8 w-14 rounded-lg bg-gray-200 animate-pulse"></div>
            <div class="sk h-8 w-14 rounded-lg bg-gray-200 animate-pulse"></div>
          </div>
        </div>
        <div class="space-y-3">
          <div class="sk h-4 w-full rounded bg-gray-200 animate-pulse"></div>
          @for (row of [1, 2, 3, 4, 5]; track row) {
            <div class="flex gap-3 border-b border-gray-100 pb-3">
              <div class="sk h-4 flex-1 rounded bg-gray-200 animate-pulse"></div>
              <div class="sk h-4 w-24 rounded bg-gray-200 animate-pulse"></div>
              <div class="sk h-4 w-20 rounded bg-gray-200 animate-pulse"></div>
              <div class="sk h-4 w-16 rounded bg-gray-200 animate-pulse"></div>
              <div class="sk h-4 w-20 rounded bg-gray-200 animate-pulse"></div>
            </div>
          }
        </div>
      </div>
      <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
        <div class="sk mb-2 h-5 w-36 rounded bg-gray-200 animate-pulse"></div>
        <div class="sk mb-4 h-4 w-full rounded bg-gray-200 animate-pulse"></div>
        <div class="sk mb-4 h-10 w-full rounded-lg bg-gray-200 animate-pulse"></div>
        <div class="sk mb-4 h-12 w-3/4 rounded bg-gray-200 animate-pulse"></div>
        <div class="mb-4 flex gap-2">
          @for (i of [1, 2, 3, 4, 5]; track i) {
            <div class="sk h-10 w-10 shrink-0 rounded-full bg-gray-200 animate-pulse"></div>
          }
        </div>
        <div class="flex gap-2">
          <div class="sk h-10 flex-1 rounded-lg bg-gray-200 animate-pulse"></div>
          <div class="sk h-10 flex-1 rounded-lg bg-gray-200 animate-pulse"></div>
        </div>
      </div>
    </div>
  } @else {
    <div class="mb-8 space-y-3">
      <div class="sk h-8 w-52 max-w-full rounded-lg bg-gray-200 animate-pulse"></div>
      <div class="sk h-4 w-full max-w-md rounded-md bg-gray-200 animate-pulse"></div>
    </div>
    <div class="mb-8 grid grid-cols-1 gap-6 md:grid-cols-2">
      @for (_ of [1, 2]; track _) {
        <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
          <div class="sk mb-2 h-4 w-40 rounded bg-gray-200 animate-pulse"></div>
          <div class="sk h-9 w-16 rounded-md bg-gray-200 animate-pulse"></div>
        </div>
      }
    </div>
    <div class="sk inline-block h-10 w-36 rounded-lg bg-gray-200 animate-pulse"></div>
  }
</div>
